let currentFilter = 'ALL';

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(filter));
    });
    render();
}

function render() {
    const searchTerm = document.getElementById('searchInput').value.toUpperCase();
    const grid = document.getElementById('archive-grid');
    grid.innerHTML = '';
    
    const filtered = libraryDatabase.filter(book => {
        const matchesFilter = currentFilter === 'ALL' || book.id.startsWith(currentFilter);
        const matchesSearch = book.title.toUpperCase().includes(searchTerm) || book.author.toUpperCase().includes(searchTerm);
        return matchesFilter && matchesSearch;
    });

    filtered.forEach(book => {
        grid.innerHTML += `
            <div class="card p-6 flex flex-col h-full">
                <span class="text-[#4CAF50] font-mono text-[9px] mb-4">${book.id}</span>
                <h3 class="serif-header text-xl text-white mb-2 leading-tight">${book.title}</h3>
                <p class="font-mono text-[10px] text-gray-500 uppercase mb-auto">${book.author}</p>
                <div class="mt-4 pt-4 border-t border-white/5 text-[10px] font-mono text-[#4CAF50]">${book.description}</div>
            </div>
        `;
    });
    document.getElementById('asset-count').textContent = `${filtered.length} ASSETS RENDERED`;
}

render();
