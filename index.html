<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.O.E. | Intelligence Archive v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,900;1,900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; -webkit-font-smoothing: antialiased; }
        .serif-header { font-family: 'Playfair Display', serif; }
        .card { background-color: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.2s ease-in-out; }
        .card:hover { border-color: #4CAF50; transform: translateY(-2px); background-color: #0f0f0f; }
        .filter-btn.active { border-color: #4CAF50; color: #4CAF50; background-color: rgba(76, 175, 80, 0.1); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 lg:p-20">

<div class="max-w-[1400px] mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-white/10 pb-10 mb-10">
        <div>
            <p class="text-[#4CAF50] font-mono text-[10px] tracking-[0.3em] uppercase mb-4">Access Level: Architect (S-Rank)</p>
            <h1 class="serif-header text-5xl md:text-7xl text-white tracking-tighter leading-none">
                M.O.E. INTELLIGENCE <br> ARCHIVE
            </h1>
        </div>
        <div class="text-left md:text-right mt-8 md:mt-0 font-mono text-[10px] text-gray-500 tracking-[0.2em] leading-relaxed uppercase">
            <p>Database V4.0 // LIVE LEDGER</p>
            <p>Internal Operating System</p>
        </div>
    </header>

    <div class="mb-12 border-b border-white/5 pb-8">
        <input type="text" id="searchInput" onkeyup="render()" placeholder="SEARCH BY NAME OR AUTHOR..." 
               class="w-full bg-[#0a0a0a] border border-[#222] px-6 py-4 text-sm font-mono uppercase tracking-widest text-white mb-6 focus:border-[#4CAF50] outline-none">
        
        <nav class="flex flex-wrap gap-3" id="filter-nav">
            <button onclick="setFilter('ALL')" class="filter-btn active px-5 py-2 border border-[#222] text-[10px] font-mono uppercase tracking-widest transition-all">ALL ASSETS</button>
            <button onclick="setFilter('SYS')" class="filter-btn px-5 py-2 border border-[#222] text-[10px] font-mono uppercase tracking-widest transition-all">SYS- (ENTERPRISE)</button>
            <button onclick="setFilter('KIN')" class="filter-btn px-5 py-2 border border-[#222] text-[10px] font-mono uppercase tracking-widest transition-all">KIN- (HARDWARE)</button>
            <button onclick="setFilter('MET')" class="filter-btn px-5 py-2 border border-[#222] text-[10px] font-mono uppercase tracking-widest transition-all">MET- (FUEL)</button>
        </nav>
    </div>

    <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
</div>

<script>
const libraryDatabase = [
    { id: 'SYS-T005', type: 'MASTER', title: 'The Singularity is Near', author: 'Ray Kurzweil', description: 'Technology & Future' },
    { id: 'KIN-B014', type: 'MASTER', title: 'Before We Forget Kindness', author: 'Toshikazu Kawaguchi', description: 'Decompression' },
    { id: 'KIN-B015', type: 'MASTER', title: 'Quantum Mechanics', author: 'Susskind & Friedman', description: 'Physics Fundamentals' },
    { id: 'SYS-B013', type: 'MASTER', title: 'Alien Thinking', author: 'Bouquet, Barsoux, Wade', description: 'Strategy' },
    { id: 'SYS-B001', type: 'MASTER', title: 'Blue Ocean Strategy', author: 'Kim & Mauborgne', description: 'Strategy' },
    { id: 'SYS-B002', type: 'MASTER', title: 'The Startup Way', author: 'Eric Ries', description: 'Innovation Scale' },
    { id: 'SYS-B003', type: 'MASTER', title: 'Build', author: 'Tony Fadell', description: 'Productization' },
    { id: 'SYS-P001', type: 'MASTER', title: 'Thinking, Fast and Slow', author: 'Daniel Kahneman', description: 'Systems 1 & 2' }
    // Add new books here following the format above
];

let currentFilter = 'ALL';

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(filter));
    });
    render();
}

function render() {
    const searchTerm = document.getElementById('searchInput').value.toUpperCase();
    const grid = document.getElementById('archive-grid');
    grid.innerHTML = '';
    
    const filtered = libraryDatabase.filter(book => {
        const matchesFilter = currentFilter === 'ALL' || book.id.startsWith(currentFilter);
        const matchesSearch = book.title.toUpperCase().includes(searchTerm) || book.author.toUpperCase().includes(searchTerm);
        return matchesFilter && matchesSearch;
    });

    filtered.forEach(book => {
        grid.innerHTML += `
            <div class="card p-6 flex flex-col h-full">
                <span class="text-[#4CAF50] font-mono text-[9px] mb-4">${book.id}</span>
                <h3 class="serif-header text-xl text-white mb-2 leading-tight">${book.title}</h3>
                <p class="font-mono text-[10px] text-gray-500 uppercase mb-auto">${book.author}</p>
                <div class="mt-4 pt-4 border-t border-white/5 text-[10px] font-mono text-[#4CAF50]">${book.description}</div>
            </div>
        `;
    });
    document.getElementById('asset-count').textContent = `${filtered.length} ASSETS RENDERED`;
}

render();
</script>
</body>
</html>
