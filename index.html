<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE M.O.E. ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#050505]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { Search } = lucide;

        const MOELibraryV5 = () => {
            const libraryDatabase = [
                { id: 'SYS-B001', type: 'MASTER', title: 'Blue Ocean Strategy', description: 'Kim & Mauborgne // Strategy' },
                { id: 'SYS-B002', type: 'MASTER', title: 'The Startup Way', description: 'Eric Ries // Innovation Scale' },
                { id: 'SYS-B003', type: 'MASTER', title: 'Build', description: 'Tony Fadell // Productization' },
                { id: 'SYS-B004', type: 'MASTER', title: 'The First 90 Days', description: 'Michael Watkins // Transition' },
                { id: 'SYS-B005', type: 'MASTER', title: 'Chaos Monkeys', description: 'Garcia Martinez // Ads & Metrics' },
                { id: 'SYS-B006', type: 'MASTER', title: 'Write Your Business Plan', description: 'Entrepreneur Media // Core' },
                { id: 'SYS-B007', type: 'MASTER', title: 'The Personal MBA', description: 'Josh Kaufman // Business OS' },
                { id: 'SYS-B008', type: 'MASTER', title: 'Insane Mode', description: 'Hamish McKenzie // Disruption' },
                { id: 'SYS-B009', type: 'MASTER', title: 'Solved', description: 'Andrew Wear // Problem Solving' },
                { id: 'SYS-B010', type: 'MASTER', title: 'Designing Here/Now', description: 'Core77 // Architecture' },
                { id: 'SYS-B011', type: 'MASTER', title: 'The Genuine Market', description: 'Zhu Haijiu // Action & Rule' },
                { id: 'SYS-P001', type: 'MASTER', title: 'Thinking, Fast and Slow', description: 'Daniel Kahneman // Systems 1 & 2' },
                { id: 'SYS-P002', type: 'MASTER', title: 'The Almanack of Naval', description: 'Eric Jorgenson // Leverage' },
                { id: 'KIN-B001', type: 'MASTER', title: 'Becoming Supernatural', description: 'Dr. Joe Dispenza // Hardware' },
                { id: 'KIN-B002', type: 'MASTER', title: 'The Power of Now', description: 'Eckhart Tolle // Presence' },
                { id: 'MET-001', type: 'MASTER', title: 'Healthbar SOP v1.0', description: 'Floor Logic & Inventory' },
                { id: 'MET-002', type: 'CLIENT', title: 'The 3L Fluid Command', description: 'Client Intake & Hydration Protocol' }
            ];

            const [activeFilter, setActiveFilter] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');

            const filters = [
                { label: 'ALL ASSETS', prefix: 'ALL' },
                { label: 'SYS- (ENTERPRISE)', prefix: 'SYS' },
                { label: 'KIN- (HARDWARE)', prefix: 'KIN' },
                { label: 'MET- (FUEL)', prefix: 'MET' }
            ];

            const filteredAssets = libraryDatabase.filter(asset => {
                const matchesFilter = activeFilter === 'ALL' || asset.id.startsWith(activeFilter);
                const matchesSearch = asset.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      asset.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            return (
                <div className="min-h-screen bg-[#050505] text-gray-200 p-8 font-sans">
                    <div className="max-w-[1400px] mx-auto">
                        <header className="border-b border-[#222] pb-8 mb-8">
                            <p className="text-[#4CAF50] font-mono text-xs font-bold uppercase tracking-[0.2em] mb-4">Access Level: Architect (S-Rank)</p>
                            <h1 className="font-serif text-5xl text-white tracking-tight">THE M.O.E. ARCHIVE</h1>
                        </header>

                        <div className="bg-[#0a0a0a] border border-[#222] p-4 flex flex-col md:flex-row gap-4 mb-10">
                            <div className="relative w-full">
                                <Search className="absolute left-3 top-2.5 h-4 w-4 text-gray-500" />
                                <input
                                    type="text"
                                    placeholder="SEARCH BY TITLE OR AUTHOR..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-[#111] border border-[#333] pl-10 py-2 text-xs text-gray-300 font-mono tracking-widest uppercase focus:border-[#4CAF50] outline-none"
                                />
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-4 mb-10 border-b border-[#111] pb-6">
                            {filters.map((f) => (
                                <button key={f.prefix} onClick={() => setActiveFilter(f.prefix)} className={`px-5 py-2 font-mono text-xs uppercase tracking-widest border transition-all ${activeFilter === f.prefix ? 'border-[#4CAF50] text-[#4CAF50] bg-[#4CAF50]/10' : 'border-[#333] text-gray-500 hover:border-gray-400'}`}>
                                    {f.label}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {filteredAssets.map(asset => (
                                <div key={asset.id} className="bg-[#111] border border-[#222] p-5 hover:border-[#4CAF50] transition-all duration-300 flex flex-col h-full">
                                    <div className="flex justify-between items-center mb-6">
                                        <span className={`font-mono text-xs font-semibold tracking-wider ${asset.type === 'MASTER' ? 'text-[#4CAF50]' : 'text-blue-400'}`}>
                                            {asset.id} ({asset.type})
                                        </span>
                                    </div>
                                    <h3 className="text-white text-xl mb-2 tracking-wide leading-tight">{asset.title}</h3>
                                    <p className="text-gray-400 text-sm tracking-wide mt-auto">{asset.description}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MOELibraryV5 />);
    </script>
</body>
</html>
